<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" color="#0a99a3" fill="none" stroke="currentColor" stroke-width=".8" stroke-linecap="round" stroke-linejoin="round"><style>.o-cw,.o-ccw,.o-breathe,.o-pulse,.o-ripple,.o-merid{transform-box:view-box;transform-origin:100px 100px;animation-duration:calc(var(--t,60s)*var(--o-k,1));animation-iteration-count:infinite;animation-timing-function:linear;animation-play-state:var(--o-play,running);animation-delay:calc(var(--dl,0s)*var(--o-k,1))}.o-cw{animation-name:o-cw}.o-ccw{animation-name:o-ccw}.o-breathe{animation-name:o-breathe;animation-timing-function:ease-in-out}.o-pulse{animation-name:o-pulse;animation-timing-function:ease-in-out}.o-ripple{animation-name:o-ripple;animation-timing-function:cubic-bezier(.2,.6,.3,1);transform:scale(.08)}.o-merid{animation-name:o-merid}.o-flow{animation:o-flow calc(var(--t,6s)*var(--o-k,1)) linear infinite;animation-play-state:var(--o-play,running)}.o-hot{fill:var(--orn-2,#d4503a)}@keyframes o-cw{to{transform:rotate(360deg)}}@keyframes o-ccw{to{transform:rotate(-360deg)}}@keyframes o-breathe{0%,100%{transform:scale(.93)}50%{transform:scale(1.07)}}@keyframes o-pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes o-ripple{0%{transform:scale(.08);opacity:0}14%{opacity:.9}100%{transform:scale(1);opacity:0}}@keyframes o-flow{to{stroke-dashoffset:-60}}@keyframes o-merid{0%{transform:scaleX(1)}6.25%{transform:scaleX(0.924)}12.5%{transform:scaleX(0.707)}18.75%{transform:scaleX(0.383)}25%{transform:scaleX(0)}31.25%{transform:scaleX(-0.383)}37.5%{transform:scaleX(-0.707)}43.75%{transform:scaleX(-0.924)}50%{transform:scaleX(-1)}56.25%{transform:scaleX(-0.924)}62.5%{transform:scaleX(-0.707)}68.75%{transform:scaleX(-0.383)}75%{transform:scaleX(0)}81.25%{transform:scaleX(0.383)}87.5%{transform:scaleX(0.707)}93.75%{transform:scaleX(0.924)}100%{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){.o-cw,.o-ccw,.o-breathe,.o-pulse,.o-ripple,.o-merid,.o-flow{animation-play-state:paused!important}}</style><radialGradient id="o-orrery-g"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient><mask id="o-orrery-m"><circle cx="100" cy="100" r="22" fill="url(#o-orrery-g)" stroke="none"/></mask><circle cx="100" cy="100" r="24" opacity="0.6" stroke-dasharray="1.5 4" stroke-width="1"/><g transform="rotate(20 100 100)"><g class="o-cw" style="--t:18s"><circle cx="100" cy="76" r="3" fill="currentColor" stroke="none"/></g></g><circle cx="100" cy="100" r="44" opacity="0.6" stroke-dasharray="1.5 4" stroke-width="1"/><g transform="rotate(140 100 100)"><g class="o-ccw" style="--t:30s"><circle cx="100" cy="56" r="4" fill="currentColor" stroke="none"/></g></g><circle cx="100" cy="100" r="64" opacity="0.6" stroke-dasharray="1.5 4" stroke-width="1"/><g transform="rotate(260 100 100)"><g class="o-cw" style="--t:48s"><circle cx="100" cy="36" r="3.4" fill="currentColor" stroke="none"/><g class="o-cw" style="--t:4s;transform-origin:100px 36px"><circle cx="100" cy="28" r="1.3" fill="currentColor" stroke="none"/></g><circle cx="100" cy="36" r="5" opacity="0.5" stroke-width="0.5"/></g></g><circle cx="100" cy="100" r="84" opacity="0.6" stroke-dasharray="1.5 4" stroke-width="1"/><g transform="rotate(70 100 100)"><g class="o-ccw" style="--t:72s"><circle cx="100" cy="16" r="4.6" fill="currentColor" stroke="none"/><ellipse cx="100" cy="16" rx="9" ry="2.8" transform="rotate(-24 100 16)" opacity=".8"/></g></g><circle cx="100" cy="100" r="96" opacity="0.3" stroke-width="0.5" stroke-dasharray=".5 3.5"/><g mask="url(#o-orrery-m)"><circle cx="100" cy="100" r="22" fill="currentColor" stroke="none"/></g><g class="o-breathe" style="--t:6s"><circle cx="100" cy="100" r="7" stroke-width="1"/><circle cx="100" cy="100" r="3.2" fill="currentColor" stroke="none"/></g></svg>