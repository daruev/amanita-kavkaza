<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" color="#0a99a3" fill="none" stroke="currentColor" stroke-width=".8" stroke-linecap="round" stroke-linejoin="round"><style>.o-cw,.o-ccw,.o-breathe,.o-pulse,.o-ripple,.o-merid{transform-box:view-box;transform-origin:100px 100px;animation-duration:calc(var(--t,60s)*var(--o-k,1));animation-iteration-count:infinite;animation-timing-function:linear;animation-play-state:var(--o-play,running);animation-delay:calc(var(--dl,0s)*var(--o-k,1))}.o-cw{animation-name:o-cw}.o-ccw{animation-name:o-ccw}.o-breathe{animation-name:o-breathe;animation-timing-function:ease-in-out}.o-pulse{animation-name:o-pulse;animation-timing-function:ease-in-out}.o-ripple{animation-name:o-ripple;animation-timing-function:cubic-bezier(.2,.6,.3,1);transform:scale(.08)}.o-merid{animation-name:o-merid}.o-flow{animation:o-flow calc(var(--t,6s)*var(--o-k,1)) linear infinite;animation-play-state:var(--o-play,running)}.o-hot{fill:var(--orn-2,#d4503a)}@keyframes o-cw{to{transform:rotate(360deg)}}@keyframes o-ccw{to{transform:rotate(-360deg)}}@keyframes o-breathe{0%,100%{transform:scale(.93)}50%{transform:scale(1.07)}}@keyframes o-pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes o-ripple{0%{transform:scale(.08);opacity:0}14%{opacity:.9}100%{transform:scale(1);opacity:0}}@keyframes o-flow{to{stroke-dashoffset:-60}}@keyframes o-merid{0%{transform:scaleX(1)}6.25%{transform:scaleX(0.924)}12.5%{transform:scaleX(0.707)}18.75%{transform:scaleX(0.383)}25%{transform:scaleX(0)}31.25%{transform:scaleX(-0.383)}37.5%{transform:scaleX(-0.707)}43.75%{transform:scaleX(-0.924)}50%{transform:scaleX(-1)}56.25%{transform:scaleX(-0.924)}62.5%{transform:scaleX(-0.707)}68.75%{transform:scaleX(-0.383)}75%{transform:scaleX(0)}81.25%{transform:scaleX(0.383)}87.5%{transform:scaleX(0.707)}93.75%{transform:scaleX(0.924)}100%{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){.o-cw,.o-ccw,.o-breathe,.o-pulse,.o-ripple,.o-merid,.o-flow{animation-p